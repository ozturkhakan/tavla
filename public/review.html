<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavla — Game Review</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-pieces="ivory">
<div class="shell">
  <nav class="nav">
    <a class="logo" href="/"><div class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="#fff"/><circle cx="8.5" cy="8.5" r="1.9" fill="#45753c"/><circle cx="12" cy="12" r="1.9" fill="#45753c"/><circle cx="15.5" cy="15.5" r="1.9" fill="#45753c"/></svg></div><span class="word" style="color:#fff">tavla</span></a>
    <a href="/"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg><span>New table</span></a>
    <a class="on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Review</span></a>
  </nav>

  <main class="main">
    <section class="stage">
      <div class="pbar" id="p-top"></div>
      <div class="rv-boardrow">
        <div class="evalbar" id="evalbar"><div class="evalfill" id="evalfill"></div><span class="evaltxt top" id="evalTop"></span><span class="evaltxt bot" id="evalBot"></span></div>
        <div class="board-wrap" id="boardWrap" data-theme="traditional">
          <svg id="board" viewBox="0 0 1000 660" aria-label="Backgammon board"></svg>
          <div class="dice" id="dice"></div>
          <div class="overlay" id="overlay" hidden></div>
        </div>
      </div>
      <div class="pbar" id="p-bottom"></div>
      <div class="rv-nav">
        <button class="ctl" id="flipBtn" title="Flip board (F)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>Flip</button>
        <div class="grow"></div>
        <button class="ctl" data-go="first" title="Start (Home)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="ctl" data-go="prev" title="Previous (←)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5v14L6 12z"/></svg></button>
        <button class="ctl" data-go="next" title="Next (→)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l10-7z"/></svg></button>
        <button class="ctl" data-go="last" title="End (End)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg></button>
        <div class="grow"></div>
        <span class="rv-pos" id="posLabel"></span>
      </div>
    </section>

    <aside class="panel">
      <div class="rv-head">
        <div class="rv-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#81b64c" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Game Review</div>
        <div class="rv-sub" id="rvSub">Loading…</div>
      </div>
      <div class="scroll" id="rvBody">
        <div class="rv-wait" id="rvWait"><div class="spinner"></div><b>Analysing your game</b><span id="rvWaitTxt">GNU Backgammon is checking every move…</span></div>
      </div>
    </aside>
  </main>
</div>
<script src="/shared/rules.js"></script>
<script src="/board.js"></script>
<script src="/review.js"></script>
</body>
</html>
