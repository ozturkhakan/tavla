<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavla — Play backgammon online</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="home">
  <div class="home-card">
    <div class="home-hero">
      <svg class="mini-board" viewBox="0 0 120 80" aria-hidden="true">
        <rect width="120" height="80" rx="6" fill="#6b3a1e"/>
        <rect x="5" y="5" width="50" height="70" fill="#e8d4ab"/><rect x="65" y="5" width="50" height="70" fill="#e8d4ab"/>
        <g fill="#9a1c1c"><path d="M5 5h8l-4 28zM21 5h8l-4 28zM37 5h8l-4 28zM65 5h8l-4 28zM81 5h8l-4 28zM97 5h8l-4 28z"/><path d="M13 75h8l-4-28zM29 75h8l-4-28zM45 75h8l-4-28zM73 75h8l-4-28zM89 75h8l-4-28zM105 75h8l-4-28z"/></g>
        <g fill="#1c1815"><path d="M13 5h8l-4 28zM29 5h8l-4 28zM45 5h8l-4 28zM73 5h8l-4 28zM89 5h8l-4 28zM105 5h8l-4 28z"/><path d="M5 75h8l-4-28zM21 75h8l-4-28zM37 75h8l-4-28zM65 75h8l-4-28zM81 75h8l-4-28zM97 75h8l-4-28z"/></g>
        <circle cx="9" cy="10" r="4" fill="#f2e7cf" stroke="#7a6446"/><circle cx="9" cy="18" r="4" fill="#f2e7cf" stroke="#7a6446"/>
        <circle cx="111" cy="70" r="4" fill="#2b2623" stroke="#b59a6e"/><circle cx="111" cy="62" r="4" fill="#2b2623" stroke="#b59a6e"/>
        <rect x="78" y="34" width="11" height="11" rx="2" fill="#fff"/><circle cx="83.5" cy="39.5" r="1.4" fill="#312e2b"/>
        <rect x="92" y="34" width="11" height="11" rx="2" fill="#fff"/><circle cx="95" cy="37" r="1.3" fill="#312e2b"/><circle cx="100" cy="42" r="1.3" fill="#312e2b"/>
      </svg>
      <h1>Play backgammon with a friend</h1>
      <p>Create a table, send the link, play.</p>
    </div>
    <form class="home-form" id="createForm">
      <label class="field"><span>Your name</span><input id="name" maxlength="20" placeholder="e.g. hakan" autocomplete="nickname" required></label>
      <div class="field"><span>Match length</span>
        <div class="seg" data-key="matchTo"><button type="button" data-v="1">1</button><button type="button" data-v="3">3</button><button type="button" data-v="5" class="on">5</button><button type="button" data-v="7">7</button><button type="button" data-v="12">12</button></div>
      </div>
      <div class="field"><span>Clock (per player, +5s per move)</span>
        <div class="seg" data-key="clockMin"><button type="button" data-v="0">None</button><button type="button" data-v="3">3 min</button><button type="button" data-v="5" class="on">5 min</button><button type="button" data-v="10">10 min</button></div>
      </div>
      <button class="btn-green" type="submit" id="createBtn">Create Table</button>
      <div class="or">OR JOIN A TABLE</div>
      <div class="join-row"><input id="joinCode" placeholder="Paste a link or table code"><button class="btn-gray" type="button" id="joinBtn">Join</button></div>
      <div class="err" id="err"></div>
    </form>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
$('#name').value = store.get('tavla.name') || '';
const opts = { matchTo: 5, clockMin: 5, inc: 5 };
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  opts[seg.dataset.key] = +b.dataset.v;
}));
const socket = io();
$('#createForm').onsubmit = e => {
  e.preventDefault();
  const name = $('#name').value.trim(); if (!name) return;
  store.set('tavla.name', name);
  $('#createBtn').disabled = true; $('#createBtn').textContent = 'Creating…';
  socket.emit('create', opts, res => { location.href = '/t/' + res.id; });
};
$('#joinBtn').onclick = () => {
  const v = $('#joinCode').value.trim();
  const m = v.match(/(?:\/t\/)?([a-z0-9]{6})\/?$/i);
  if (!m) { $('#err').textContent = 'That does not look like a table link or code.'; return; }
  if ($('#name').value.trim()) store.set('tavla.name', $('#name').value.trim());
  location.href = '/t/' + m[1].toLowerCase();
};
</script>
</body>
</html>
